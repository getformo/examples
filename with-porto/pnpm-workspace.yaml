# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).
minimumReleaseAge: 10080
# Formo publishes its own SDK; don't hold it back behind the release-age gate.
minimumReleaseAgeExclude:
  # Remove after 2026-09-01, once 16.3.3 is seven days old (fixes GHSA-2xp9-vwfh-vxw4).
  - 'next@16.3.3'
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - "@formo/analytics"
  - postcss@8.5.10
  - hono@4.12.27
  - sharp@0.35.0
  - postcss@8.5.12
  - postcss@8.5.18
# Security: force patched transitive versions (Aikido CVE remediation).
overrides:
  nanoid@<3.3.18: 3.3.18
  shell-quote@<=1.8.4: 1.10.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  hono@<4.12.27: ^4.12.27
  postcss@<8.5.18: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  'ws@>=8.0.0 <8.21.0': 8.21.0
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
allowBuilds:
  "@reown/appkit": true
  sharp: true
  keccak: true
  secp256k1: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: true
  esbuild: true
  core-js: true
  core-js-pure: true
