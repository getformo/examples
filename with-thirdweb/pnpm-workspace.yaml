# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).

# Security: force patched transitive versions (Aikido CVE remediation).
minimumReleaseAge: 10080
overrides:
  'elliptic@<=6.6.0': 6.6.1
  'axios@<0.31.1': 0.31.1
  'axios@>=1.0.0 <1.15.2': 1.15.2
  'fastify@<5.8.5': 5.8.5
  '@coinbase/wallet-sdk@>=4.0.0-beta.0 <4.3.0': 4.3.0
  'ws@>=7.0.0 <7.5.10': 7.5.10
  'ws@>=8.0.0 <8.17.1': 8.17.1
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true
nodeLinker: hoisted

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
allowBuilds:
  "@reown/appkit": true
  sharp: true
  keccak: true
  secp256k1: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: true
  esbuild: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  protobufjs: true
