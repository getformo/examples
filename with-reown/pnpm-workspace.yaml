# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).
minimumReleaseAge: 10080
# Formo publishes its own SDK; don't hold it back behind the release-age gate.
minimumReleaseAgeExclude:
  # Remove after 2026-09-01, once 16.3.3 is seven days old (fixes GHSA-2xp9-vwfh-vxw4).
  - 'next@16.3.3'
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  # GHSA high-severity ReDoS; every 1.x/2.x/5.x patch is newer than the
  # 7-day gate, so the package is exempted by name rather than by version.
  - brace-expansion
  - "@formo/analytics"
  - postcss@8.5.10
  - axios@1.18.0
  - sharp@0.35.0
  - postcss@8.5.12
  - postcss@8.5.18

# Security: force patched transitive versions (Aikido CVE remediation).
overrides:
  nanoid@<3.3.18: 3.3.18
  shell-quote@<=1.8.4: 1.10.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  # GHSA advisories in the 0.32.x line; reached via @reown/appkit connectors.
  "@metamask/sdk@<0.33.1": "^0.33.1"
  "@metamask/sdk-communication-layer@<0.33.1": "^0.33.1"
  # 1.8.23 drags in the wagmi 3.x line (and a @wagmi/core whose tempo
  # connectors don't resolve). 1.8.5 keeps the example on wagmi 2.x.
  '@reown/appkit': '1.8.5'
  '@reown/appkit-adapter-wagmi': '1.8.5'
  # The adapter's @wagmi/connectors range floats to 8.x, which pulls the
  # @wagmi/core 3.x line whose tempo connectors don't resolve. Hold the whole
  # wagmi trio at the combination HEAD built against.
  'wagmi@>=2.0.0 <3.0.0': '2.16.9'
  '@wagmi/core@>=2.0.0 <3.0.0': '2.20.3'
  '@wagmi/connectors@>=5.0.0': '5.9.9'
  # 1.54.0 imports @x402/{core,evm,svm} subpaths that aren't installable
  # here, breaking the webpack build. Hold at the last version that built.
  '@coinbase/cdp-sdk': '1.49.2'
  # Migrated from the package.json "pnpm" field, which pnpm 11 ignores.
  h3: '^1.15.9'
  lodash: '^4.18.1'
  # Bumped from 4.2.6: GHSA-2m8v-j782-fhvr (zero-attachment memory exhaustion)
  # covers <4.2.7, reached through @metamask/sdk's socket.io-client.
  socket.io-parser@<4.2.7: 4.2.7
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'preact@>=10.27.0 <10.27.3': 10.27.3
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'picomatch@<2.3.2': 2.3.2
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
  axios@<1.18.0: ^1.18.0
  brace-expansion@<1.1.18: ^1.1.18
  postcss@<8.5.18: ^8.5.18
  sharp@<0.35.0: ^0.35.0
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
# Allow the build scripts these trusted deps need.
allowBuilds:
  '@reown/appkit': true
  bufferutil: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
