# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).
# Having this file also makes this example its own isolated workspace root.

# Formo publishes its own SDK; don't hold it back behind the release-age gate.
# Browser-compat data packages (browserslist ecosystem) update daily — exclude
# from the release-age gate since they are pure data, not executable code.
minimumReleaseAgeExclude:
  # Remove after 2026-09-01, once 16.3.3 is seven days old (fixes GHSA-2xp9-vwfh-vxw4).
  - 'next@16.3.3'
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  # GHSA high-severity ReDoS; every 1.x/2.x/5.x patch is newer than the
  # 7-day gate, so the package is exempted by name rather than by version.
  - brace-expansion
  - "@formo/analytics"
  - "baseline-browser-mapping"
  - "caniuse-lite"
  - "electron-to-chromium"
  - "node-releases"
  - bigint-buffer@1.1.6
  - '@metamask/sdk-communication-layer@0.33.1'
  - '@metamask/sdk@0.33.1'
  - elliptic@6.6.2
  - postcss@8.5.10
  - fast-xml-parser@5.7.0
  - axios@1.18.0
  - js-yaml
  - sharp@0.35.0
  - postcss@8.5.12
  - postcss@8.5.18
  - valibot@1.4.2
# Security: force patched transitive versions (Aikido CVE remediation).
minimumReleaseAge: 10080
overrides:
  nanoid@<3.3.18: 3.3.18
  'shell-quote@<1.11.0': 1.11.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  'valibot@>=0.31.0 <1.2.0': 1.2.0
  'axios@<1.20.0': ^1.20.0
  '@react-native-community/cli@>=1.0.0 <17.0.1': 17.0.1
  '@react-native-community/cli-server-api@>=1.0.0 <17.0.1': 17.0.1
  i18next@<=24.1.2: 24.1.2
  'js-yaml@>=3.0.0 <3.15.2': ^3.15.2
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.1': ^8.21.1
  'ws@>=7.0.0 <7.5.11': 7.5.11
  '@metamask/sdk-communication-layer@>=0.16.0 <=0.33.0': ^0.33.1
  '@metamask/sdk@>=0.16.0 <=0.33.0': ^0.33.1
  'brace-expansion@<1.1.21': ^1.1.21
  fast-xml-parser@<5.7.0: ^5.7.0
  postcss@<8.5.18: ^8.5.18
  'sharp@<0.35.5': ^0.35.5
  valibot@<=1.4.1: ^1.4.2
  'qs@>=6.0.0 <6.16.0': ^6.16.0
  'joi@>=17.0.0 <17.13.8': ^17.13.8
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  'compression@>=1.0.0 <1.8.2': ^1.8.2
  'es-toolkit@>=1.0.0 <1.51.0': ^1.51.0
  'zod@>=4.0.0 <4.5.0': ^4.5.0
  '@walletconnect/sign-client@>=2.0.0 <2.23.10': 2.23.10
  '@walletconnect/utils@>=2.0.0 <2.23.10': 2.23.10
  '@walletconnect/core@>=2.0.0 <2.23.10': 2.23.10
  'source-map-js@>=1.0.0 <1.2.2': ^1.2.2
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true
# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
# Allow the build scripts these trusted deps need.
allowBuilds:
  '@tailwindcss/oxide': true
  bigint-buffer: true
  bufferutil: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no fixed release. It is reached
    # only through build tooling (micromatch / fast-glob / chokidar). Remove
    # as soon as a fix is published.
    - GHSA-vfj7-8cjw-p6xm
    # Reached through the Crossmint SDK's React Native and Solana dependencies.
    # node-forge <=1.4.0 and bigint-buffer <=1.1.5 have no fixed release;
    # image-size is fixed only in 2.x, a major bump of metro's dependency.
    - GHSA-86w9-cpqp-85rv
    - GHSA-3gc7-fjrx-p6mg
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
