# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).
# Having this file also makes this example its own isolated workspace root.

# Formo publishes its own SDK; don't hold it back behind the release-age gate.
# Browser-compat data packages (browserslist ecosystem) update daily — exclude
# from the release-age gate since they are pure data, not executable code.
minimumReleaseAgeExclude:
  # GHSA high-severity ReDoS; every 1.x/2.x/5.x patch is newer than the
  # 7-day gate, so the package is exempted by name rather than by version.
  - brace-expansion
  - "@formo/analytics"
  - "baseline-browser-mapping"
  - "caniuse-lite"
  - "electron-to-chromium"
  - "node-releases"
  - bigint-buffer@1.1.6
  - '@metamask/sdk-communication-layer@0.33.1'
  - '@metamask/sdk@0.33.1'
  - elliptic@6.6.2
  - postcss@8.5.10
  - fast-xml-parser@5.7.0
  - axios@1.18.0
  - js-yaml
  - sharp@0.35.0
  - postcss@8.5.12
  - postcss@8.5.18
  - valibot@1.4.2
# Security: force patched transitive versions (Aikido CVE remediation).
minimumReleaseAge: 10080
overrides:
  nanoid@<3.3.17: 3.3.17
  shell-quote@<=1.8.4: 1.10.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  'valibot@>=0.31.0 <1.2.0': 1.2.0
  axios@<1.18.0: ^1.18.0
  '@react-native-community/cli@>=1.0.0 <17.0.1': 17.0.1
  '@react-native-community/cli-server-api@>=1.0.0 <17.0.1': 17.0.1
  i18next@<=24.1.2: 24.1.2
  'shell-quote@>=1.1.0 <=1.8.4': 1.10.0
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
  '@metamask/sdk-communication-layer@>=0.16.0 <=0.33.0': ^0.33.1
  '@metamask/sdk@>=0.16.0 <=0.33.0': ^0.33.1
  brace-expansion@<1.1.18: ^1.1.18
  fast-xml-parser@<5.7.0: ^5.7.0
  postcss@<8.5.18: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  valibot@<=1.4.1: ^1.4.2
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true
# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
# Allow the build scripts these trusted deps need.
allowBuilds:
  '@tailwindcss/oxide': true
  bigint-buffer: true
  bufferutil: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
