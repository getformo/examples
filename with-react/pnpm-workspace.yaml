# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).

# Security: force patched transitive versions (Aikido CVE remediation).
minimumReleaseAge: 10080
# Formo publishes its own SDK; don't hold it back behind the release-age gate.
minimumReleaseAgeExclude:
  - "@formo/analytics"
  # Security patch <7d old; allow past the release-age gate.
  - "form-data"
overrides:
  'nth-check@<2.0.1': 2.0.1
  'serialize-javascript@<=7.0.2': 7.0.3
  'underscore@<=1.13.7': 1.13.8
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'form-data@>=3.0.0 <3.0.5': 3.0.5
  'shell-quote@>=1.1.0 <=1.8.3': 1.8.4
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true

# react-scripts (CRA) expects a flat node_modules.
nodeLinker: hoisted

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
allowBuilds:
  "@reown/appkit": true
  sharp: true
  keccak: true
  secp256k1: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: true
  esbuild: true
  core-js: true
  core-js-pure: true
