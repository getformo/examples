packages:
  - 'packages/*'

# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc/.yarnrc).
minimumReleaseAge: 10080
# Formo publishes its own SDK; don't hold it back behind the release-age gate.
minimumReleaseAgeExclude:
  # GHSA high-severity ReDoS; every 1.x/2.x/5.x patch is newer than the
  # 7-day gate, so the package is exempted by name rather than by version.
  - brace-expansion
  - "@formo/analytics"
  # Security patch <7d old; allow past the release-age gate.
  - "form-data"
  - debug@4.3.1
  - tar@6.2.1
  - undici@5.28.5
  - path-to-regexp@6.3.0
  - esbuild@0.24.3
  - elliptic@6.6.2
  - undici@6.23.0
  - tar@7.5.7
  - semver@7.5.2
  - undici@5.29.0
  - tar@7.5.3
  - tar@7.5.8
  - ajv@8.18.0
  - tar@7.5.10
  - tar@7.5.11
  - undici@6.24.0
  - tar@7.5.4
  - postcss@8.5.10
  - '@tootallnate/once@2.0.1'
  - uuid@11.1.1
  - tar@7.5.16
  - undici@6.27.0
  - axios@1.18.0
  - tar@7.5.18
  - tar@7.5.19
  - tar@7.5.17
  - hono@4.12.27
  - sharp@0.35.0
  - postcss@8.5.12
  - tar@7.5.21
  - postcss@8.5.18

# Security: force patched transitive versions (Aikido CVE remediation).
overrides:
  nanoid@<3.3.17: 3.3.17
  shell-quote@<=1.8.4: 1.10.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  # 1.54.0 imports @x402/{core,evm,svm} subpaths that aren't installable
  # here, breaking the webpack build. Hold at the last version that built.
  '@coinbase/cdp-sdk': '1.49.2'
  # Migrated from the package.json "pnpm" field, which pnpm 11 ignores.
  axios: '^1.18.0'
  lodash: '^4.18.1'
  h3: '^1.15.9'
  hono: '^4.12.27'
  undici: '^7.28.0'
  next: '^15.5.15'
  elliptic: '^6.6.1'
  # Keep direct and transitive viem consumers on the reviewed release.
  viem: '2.55.10'
  '@babel/traverse@<7.23.2': 7.23.2
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
  form-data@<4.0.6: ^4.0.6
  '@tootallnate/once@<2.0.1': ^2.0.1
  ajv@>=7.0.0-alpha.0 <8.18.0: ^8.18.0
  brace-expansion@<1.1.18: ^1.1.18
  debug@>=4.0.0 <4.3.1: ^4.3.1
  path-to-regexp@>=4.0.0 <6.3.0: ^6.3.0
  postcss@<8.5.18: ^8.5.18
  semver@>=7.0.0 <7.5.2: ^7.5.2
  # The patched sharp line requires Node >=20.9.0, so package.json's
  # engines.node was raised from >=18.18.0 to match. No 0.35.x supports
  # Node 18, and Node 18 reached EOL in April 2025.
  sharp@<0.35.0: ^0.35.0
  tar@<7.5.21: ^7.5.21
  uuid@<11.1.1: ^11.1.1
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true
nodeLinker: hoisted

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
allowBuilds:
  "@reown/appkit": true
  sharp: true
  keccak: true
  secp256k1: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: true
  esbuild: true
  core-js: true
  core-js-pure: true
