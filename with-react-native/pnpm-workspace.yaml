# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).
nodeLinker: hoisted
minimumReleaseAge: 10080
# Our own package: the release-age guard exists to blunt supply-chain attacks on
# third-party deps, and delaying our own SDK by a week defeats the point of an
# example that demonstrates it.
minimumReleaseAgeExclude:
  # GHSA high-severity ReDoS; every 1.x/2.x/5.x patch is newer than the
  # 7-day gate, so the package is exempted by name rather than by version.
  - brace-expansion
  - "@formo/analytics-react-native"
  # Expo SDK 57 compatibility patches are newer than the quarantine window.
  - expo
  - "expo-*"
  - babel-preset-expo
  - "@expo/*"
  - expo-application
  - expo-constants
  - expo-crypto
  - expo-linking
  - expo-router
  - expo-status-bar
  - jest-expo
  - "@react-native-async-storage/async-storage"
  - "@expo/local-build-cache-provider"
  - '@metamask/sdk-communication-layer@0.33.1'
  - '@metamask/sdk@0.33.1'
  - elliptic@6.6.2
  - '@stablelib/ed25519@2.0.3'
  - postcss@8.5.10
  - uuid@11.1.1
  - axios@1.18.0
  - js-yaml
  - fast-uri@3.1.4
  - postcss@8.5.12
  - postcss@8.5.18
  - fast-uri@3.1.3
  - undici@7.24.1

# Security: force patched transitive versions (Aikido CVE remediation).
#
# These MUST live here, not in package.json. pnpm 11 no longer reads the
# "pnpm" field from package.json and silently ignores it — it only warns:
#   [WARN] The "pnpm" field in package.json is no longer read by pnpm.
#          The following keys were ignored: "pnpm.overrides"
# The h3/undici/node-forge/@wagmi/core/@xmldom/xmldom pins below were stranded
# in package.json by that change; undici stayed on 6.25.0 and @xmldom/xmldom
# kept resolving 0.7.13 alongside 0.8.13 for as long as they sat there.
overrides:
  nanoid@<3.3.17: 3.3.17
  shell-quote@<=1.8.4: 1.10.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  # @wagmi/connectors 6.x depends on porto, whose 'porto/internal' subpath
  # Metro cannot resolve — it breaks the native bundle outright, which the
  # typecheck-only CI check does not catch. 5.7.7 is what main shipped.
  '@wagmi/connectors@>=6.0.0': '5.7.7'
  fast-uri@<3.1.2: 3.1.2
  # Bumped from 4.2.6: GHSA-2m8v-j782-fhvr (zero-attachment memory exhaustion)
  # covers <4.2.7, reached through @metamask/sdk's socket.io-client.
  socket.io-parser@<4.2.7: 4.2.7
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
  'shell-quote@>=1.1.0 <=1.8.4': 1.10.0
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  h3@<1.15.9: ^1.15.9
  undici: '^7.24.1'
  node-forge@<1.4.0: ^1.4.0
  '@wagmi/core': '^2.16.4'
  '@xmldom/xmldom@<0.8.13': 0.8.13
  # GHSA-23hp-3jrh-7fpw (decompression DoS). No patched 6.x line exists, so
  # remediation requires the 7.x major. Reached via expo > @expo/cli > tar.
  tar@<7.5.19: ^7.5.19
  '@metamask/sdk-communication-layer@>=0.16.0 <=0.33.0': ^0.33.1
  '@metamask/sdk@>=0.16.0 <=0.33.0': ^0.33.1
  axios@<1.18.0: ^1.18.0
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri@>=3.0.0 <3.1.3: ^3.1.3
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  postcss@<8.5.18: ^8.5.18
  uuid@<11.1.1: ^11.1.1
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
# Allow the build scripts these trusted deps need.
allowBuilds:
  bufferutil: true
  keccak: true
  unrs-resolver: true
  utf-8-validate: true
