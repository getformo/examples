# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).
minimumReleaseAge: 10080
# Formo publishes its own SDK; don't hold it back behind the release-age gate.
minimumReleaseAgeExclude:
  # Remove after 2026-09-01, once 15.5.24 is seven days old (fixes GHSA-2xp9-vwfh-vxw4).
  - 'next@15.5.24'
  - '@next/env@15.5.24'
  - '@next/swc-darwin-arm64@15.5.24'
  - '@next/swc-darwin-x64@15.5.24'
  - '@next/swc-linux-arm64-gnu@15.5.24'
  - '@next/swc-linux-arm64-musl@15.5.24'
  - '@next/swc-linux-x64-gnu@15.5.24'
  - '@next/swc-linux-x64-musl@15.5.24'
  - '@next/swc-win32-arm64-msvc@15.5.24'
  - '@next/swc-win32-x64-msvc@15.5.24'
  # GHSA high-severity ReDoS; every 1.x/2.x/5.x patch is newer than the
  # 7-day gate, so the package is exempted by name rather than by version.
  - brace-expansion
  - js-yaml@4.3.1
  - "@formo/analytics"
  - postcss@8.5.10
  - sharp@0.35.0
  - postcss@8.5.12
  - postcss@8.5.18
# Security: force patched transitive versions (Aikido CVE remediation).
overrides:
  nanoid@<3.3.18: 3.3.18
  shell-quote@<=1.8.4: 1.10.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
  brace-expansion@<1.1.18: ^1.1.18
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  postcss@<8.5.18: ^8.5.18
  sharp@<0.35.0: ^0.35.0
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
allowBuilds:
  "@reown/appkit": true
  sharp: true
  keccak: true
  secp256k1: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: true
  esbuild: true
  core-js: true
  core-js-pure: true
