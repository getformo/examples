# pnpm 11 reads pnpm-specific settings from here (no longer from .npmrc).

# Security: force patched transitive versions (Aikido CVE remediation).
minimumReleaseAge: 10080
# Formo publishes its own SDK; don't hold it back behind the release-age gate.
minimumReleaseAgeExclude:
  # GHSA high-severity ReDoS; every 1.x/2.x/5.x patch is newer than the
  # 7-day gate, so the package is exempted by name rather than by version.
  - brace-expansion
  - "@formo/analytics"
  # Security patch <7d old; allow past the release-age gate.
  - "form-data"
  - webpack-dev-server@5.2.1
  - postcss@8.4.31
  - postcss@8.5.10
  - webpack-dev-server@5.2.4
  - '@tootallnate/once@2.0.1'
  - serialize-javascript@7.0.5
  - webpack-dev-server@5.2.5
  - js-yaml
  - webpack-dev-server@5.2.6
  - svgo@2.8.3
  - postcss@8.5.12
  - postcss@8.5.18
overrides:
  nanoid@<3.3.18: 3.3.18
  shell-quote@<=1.8.4: 1.10.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  'nth-check@<2.0.1': 2.0.1
  serialize-javascript@<7.0.5: ^7.0.5
  'underscore@<=1.13.7': 1.13.8
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.11
  form-data@<4.0.6: ^4.0.6
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  '@tootallnate/once@<2.0.1': ^2.0.1
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  postcss@<8.5.18: ^8.5.18
  # Scoped to the 2.x line: react-scripts pins svgo 1.3.2, and 2.x dropped
  # css-select-base-adapter, so forcing 1.x -> 2.x breaks the CRA build. The
  # 1.x advisory has no patched release (the line is EOL) and is build-only.
  svgo@>=2.0.0 <2.8.3: ^2.8.3
  # Scoped to the 5.x line, same reasoning as svgo above: react-scripts 5.0.1
  # depends on webpack-dev-server ^4.6.0 and calls onAfterSetupMiddleware,
  # which v5 removed, so forcing 4.x -> 5.x makes `react-scripts start` fail
  # with an options-schema error. The 4.x advisories have no patched release
  # (the line is EOL) and affect the dev server only, never the build output.
  webpack-dev-server@>=5.0.0 <5.2.6: ^5.2.6
# Block git/http/file-protocol subdependencies (pnpm 11 default; set explicitly).
blockExoticSubdeps: true

# react-scripts (CRA) expects a flat node_modules.
nodeLinker: hoisted

# pnpm 11 blocks dependency build scripts by default (strictDepBuilds).
allowBuilds:
  "@reown/appkit": true
  sharp: true
  keccak: true
  secp256k1: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: true
  esbuild: true
  core-js: true
  core-js-pure: true
