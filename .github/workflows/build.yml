name: Build Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          # Each key maps to a path pattern. Workflow-file changes rebuild all.
          filters: |
            with-react:
              - 'with-react/**'
              - '.github/workflows/build.yml'
            with-next-app-router:
              - 'with-next-app-router/**'
              - '.github/workflows/build.yml'
            with-next-page-router:
              - 'with-next-page-router/**'
              - '.github/workflows/build.yml'
            with-dynamic:
              - 'with-dynamic/**'
              - '.github/workflows/build.yml'
            with-farcaster:
              - 'with-farcaster/**'
              - '.github/workflows/build.yml'
            with-metamask:
              - 'with-metamask/**'
              - '.github/workflows/build.yml'
            with-porto:
              - 'with-porto/**'
              - '.github/workflows/build.yml'
            with-tempo:
              - 'with-tempo/**'
              - '.github/workflows/build.yml'
            with-privy:
              - 'with-privy/**'
              - '.github/workflows/build.yml'
            with-reown:
              - 'with-reown/**'
              - '.github/workflows/build.yml'
            with-thirdweb:
              - 'with-thirdweb/**'
              - '.github/workflows/build.yml'
            with-web3-onboard:
              - 'with-web3-onboard/**'
              - '.github/workflows/build.yml'
            with-react-native:
              - 'with-react-native/**'
              - '.github/workflows/build.yml'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: with-react
            dir: with-react
            pm: yarn
            build: build
            node: 20

          - name: with-next-app-router
            dir: with-next-app-router
            pm: yarn-berry
            build: next:build
            node: 20

          - name: with-next-page-router
            dir: with-next-page-router
            pm: npm
            build: build
            node: 20

          - name: with-dynamic
            dir: with-dynamic
            pm: npm
            build: build
            node: 20

          - name: with-farcaster
            dir: with-farcaster
            pm: yarn
            build: build
            node: 22

          - name: with-metamask
            dir: with-metamask
            pm: npm
            build: build
            node: 20

          - name: with-porto
            dir: with-porto
            pm: bun
            build: build
            node: 20

          - name: with-tempo
            dir: with-tempo
            pm: npm
            build: build
            node: 20

          - name: with-privy
            dir: with-privy
            pm: pnpm
            build: build
            node: 20

          - name: with-reown
            dir: with-reown
            pm: pnpm
            build: build
            node: 20

          - name: with-thirdweb
            dir: with-thirdweb
            pm: npm-legacy-peer-deps
            build: build
            node: 20

          - name: with-web3-onboard
            dir: with-web3-onboard
            pm: npm
            build: build
            node: 20

          - name: with-react-native
            dir: with-react-native
            pm: pnpm
            build: typecheck
            node: 20

          # with-solana: requires @formo/analytics@1.28.2 (not yet published)

    name: ${{ matrix.name }}
    if: contains(fromJSON(needs.changes.outputs.examples), matrix.name)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Install bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup env files
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          if [ -f .env.example ]; then
            sed 's/=$/=ci_test_key/' .env.example | \
            sed 's/=your_[a-z_]*_here$/=ci_test_key/' | \
            sed 's/="your_[a-z_]*"$/=ci_test_key/' | \
            sed 's/=your-[a-z-]*$/=ci_test_key/' > .env
          fi

      - name: Setup nested env (next-app-router)
        if: matrix.name == 'with-next-app-router'
        shell: bash
        run: |
          echo "NEXT_PUBLIC_FORMO_ANALYTICS_WRITE_KEY=ci_test_key" > with-next-app-router/packages/nextjs/.env

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        shell: bash
        env:
          PM: ${{ matrix.pm }}
          HUSKY: "0"
        run: |
          case "$PM" in
            yarn)              yarn install --frozen-lockfile ;;
            yarn-berry)        yarn install ;;
            pnpm)              pnpm install --frozen-lockfile ;;
            bun)               bun install --frozen-lockfile ;;
            npm-legacy-peer-deps) npm ci --legacy-peer-deps ;;
            *)                 npm ci ;;
          esac

      - name: Build
        working-directory: ${{ matrix.dir }}
        shell: bash
        env:
          BUILD_SCRIPT: ${{ matrix.build }}
          PM: ${{ matrix.pm }}
          CI: false
        run: |
          case "$PM" in
            yarn|yarn-berry) yarn "$BUILD_SCRIPT" ;;
            pnpm)            pnpm run "$BUILD_SCRIPT" ;;
            bun)             bun run "$BUILD_SCRIPT" ;;
            *)               npm run "$BUILD_SCRIPT" ;;
          esac
