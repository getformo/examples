version: 2

# Every example is an independent pnpm project with its own lockfile, and they
# are deliberately NOT combined into one multi-directory entry: a grouped update
# spanning directories would let one example break the shared pull request and
# block valid updates for all the others. One entry per example keeps failures
# isolated.
#
# Within an example, updates ARE grouped, so a single shared transitive advisory
# (postcss, brace-expansion) opens one PR per example rather than one per
# package. Majors are excluded from the group and land on their own, since these
# examples double as upgrade documentation and need review alongside the bump.
#
# cooldown must stay >= the `minimumReleaseAge: 10080` (7 days) that every
# example's pnpm-workspace.yaml sets. A shorter cooldown would open PRs that CI
# then fails to install, because pnpm refuses versions younger than the gate.

updates:
  - package-ecosystem: npm
    directory: "/with-angular"
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/with-crossmint"
